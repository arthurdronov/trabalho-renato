<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      <ion-icon name="wallet-outline" style="vertical-align:middle; margin-right:6px;"></ion-icon>
      Carteira
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" title="Sair">
        <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" *ngIf="user">

  <!-- Saldo -->
  <ion-card class="balance-card">
    <ion-card-content>
      <p class="balance-label">Olá, {{ user.name.split(' ')[0] }} 👋</p>
      <h2 class="balance-amount">{{ fmtBalance }}</h2>
      <div class="address-row">
        <span class="address-text">{{ user.address }}</span>
        <ion-button fill="clear" size="small" (click)="copyAddress()" class="copy-btn">
          <ion-icon name="copy-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- Transferência -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>
        <ion-icon name="send-outline" style="vertical-align:middle; margin-right:6px;"></ion-icon>
        Nova transferência
      </ion-card-title>
    </ion-card-header>
    <ion-card-content>

      <ion-item lines="full">
        <ion-label position="stacked">Destinatário</ion-label>
        <ion-select [(ngModel)]="toEmail" placeholder="Selecione…" interface="action-sheet">
          <ion-select-option *ngFor="let c of contacts" [value]="c.email">
            {{ c.name }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item lines="full" class="ion-margin-top">
        <ion-label position="stacked">Valor (R$)</ion-label>
        <ion-input
          type="number"
          min="1"
          step="0.01"
          placeholder="0,00"
          [(ngModel)]="amount">
        </ion-input>
      </ion-item>

      <ion-item lines="full" class="ion-margin-top">
        <ion-label position="stacked">Observação (opcional)</ion-label>
        <ion-input
          type="text"
          placeholder="Pagamento, pix, etc."
          [(ngModel)]="note">
        </ion-input>
      </ion-item>

      <ion-button
        expand="block"
        (click)="send()"
        [disabled]="sending"
        class="ion-margin-top">
        <ion-spinner *ngIf="sending" name="crescent" slot="start"></ion-spinner>
        <ion-icon *ngIf="!sending" name="finger-print-outline" slot="start"></ion-icon>
        {{ sending ? 'Autenticando…' : 'Confirmar com biometria' }}
      </ion-button>

    </ion-card-content>
  </ion-card>

</ion-content>
