name: Deploy na AWS Ubuntu

on:
  push:
    branches:
      - main  # Ou 'master', mude para a sua branch principal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências e CLI do Ionic
        run: |
          npm install
          npm install -g @ionic/cli

      - name: Gerar o Build de Produção
        run: ionic build --prod

      - name: Enviar os arquivos para a AWS (Rsync via SSH)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.AWS_HOST }}
          REMOTE_USER: ${{ secrets.AWS_USER }}
          TARGET: "/var/www/html/"
          SOURCE: "www/"
          ARGS: "-rlgoDzvO --delete"
